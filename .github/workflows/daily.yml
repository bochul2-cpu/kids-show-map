name: Daily data refresh

on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC = 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write config.py from secrets
        run: |
          cat > config.py << PYEOF
          KOPIS_SERVICE_KEY = "${{ secrets.KOPIS_SERVICE_KEY }}"
          NAVER_HEADERS = {
              "X-NCP-APIGW-API-KEY-ID": "${{ secrets.NAVER_API_KEY_ID }}",
              "X-NCP-APIGW-API-KEY": "${{ secrets.NAVER_API_KEY }}",
          }
          NAVER_MAP_CLIENT_ID = "${{ secrets.NAVER_MAP_CLIENT_ID }}"
          TOUR_API_KEY = "${{ secrets.TOUR_API_KEY }}"
          PYEOF

      - run: python collect.py
      # TourAPI가 트래픽 한도(429)에 걸려 재시도를 계속하면 예전엔 GitHub Actions
      # 기본 제한시간(6시간)을 다 채우고서야 죽었고, 그동안 이 뒤의 모든 단계
      # (NAVER 지역검색/병원/빌드/커밋)까지 통째로 건너뛰어져서 하루 전체가 날아갔다
      # (2026-09-06, 09-07, 09-09 확인됨). 60분으로 일찍 실패하게 하고,
      # continue-on-error로 실패해도 뒤 단계는 계속 진행되게 한다 - TourAPI 항목만
      # 그날 갱신을 못 받고 이전 데이터를 유지할 뿐, 나머지는 정상적으로 갱신된다.
      - run: python collect_tour.py
        timeout-minutes: 60
        continue-on-error: true
      - run: python collect_local.py
      - run: python manual_places.py
      - run: python collect_hospital.py
      - run: python build_map.py
      - run: python build_hospital.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/places.json index.html data/hospitals.json hospital.html
          git diff --staged --quiet && echo "no changes" || git commit -m "Daily data refresh"
          git push
